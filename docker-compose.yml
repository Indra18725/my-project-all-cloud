services:
  pyspark-notebooks:
    build:
      context: .
      dockerfile_inline: |
        FROM apache/spark:4.2.1-scala2.13-java21-python3-ubuntu
        USER root
        COPY --from=ghcr.io/astral-sh/uv:latest /uv /uvx /bin/

        ENV UV_PROJECT_ENVIRONMENT=/opt/venv
        ENV PATH="/opt/venv/bin:$${PATH}"
        RUN uv venv /opt/venv --python 3.11 && \
            SITE_PKGS=$$(/opt/venv/bin/python -c "import site; print(site.getsitepackages()[0])") && \
            echo "/opt/spark/python" > "$${SITE_PKGS}/pyspark.pth" && \
            ls /opt/spark/python/lib/py4j-*-src.zip >> "$${SITE_PKGS}/pyspark.pth"

        ENV SPARK_HOME=/opt/spark
        ENV PYSPARK_PYTHON=/opt/venv/bin/python
        ENV PYSPARK_DRIVER_PYTHON=/opt/venv/bin/python

        # 1. Resolve Azure (hadoop-azure), AWS (hadoop-aws + AWS SDK bundle), and Delta Lake via Ivy
        # 2. Download the shaded Google Cloud Storage (gcs-connector) JAR directly to avoid Guava/gRPC conflicts
        RUN HADOOP_VER=$$(ls /opt/spark/jars/hadoop-client-api-*.jar | sed -E 's/.*hadoop-client-api-([0-9.]+)\.jar/\1/') && \
            echo "Detected Hadoop version: $${HADOOP_VER}" && \
            echo ":quit" | /opt/spark/bin/spark-shell \
              --conf "spark.jars.ivy=/tmp/ivy" \
              --packages "org.apache.hadoop:hadoop-azure:$${HADOOP_VER},org.apache.hadoop:hadoop-aws:$${HADOOP_VER},io.delta:delta-spark_4.2_2.13:4.4.1" && \
            cp -v /tmp/ivy/jars/*.jar /opt/spark/jars/ && \
            rm -rf /tmp/ivy && \
            curl -fSL "https://repo1.maven.org/maven2/com/google/cloud/bigdataoss/gcs-connector/hadoop3-2.2.25/gcs-connector-hadoop3-2.2.25-shaded.jar" \
              -o /opt/spark/jars/gcs-connector-hadoop3-2.2.25-shaded.jar

        RUN mkdir -p /opt/spark/work-dir /opt/spark/notebooks
        WORKDIR /opt/spark/work-dir

    container_name: pyspark_notebook_all_cloud
    user: root
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./notebooks:/opt/spark/notebooks
      - ./config:/opt/spark/work-dir
      - pyspark_venv:/opt/venv
    command:
      - /bin/bash
      - -c
      - |
        mkdir -p /opt/spark/notebooks/data
        SITE_PKGS=$$(/opt/venv/bin/python -c "import site; print(site.getsitepackages()[0])")
        echo "/opt/spark/python" > "$${SITE_PKGS}/pyspark.pth"
        ls /opt/spark/python/lib/py4j-*-src.zip >> "$${SITE_PKGS}/pyspark.pth"
        if [ ! -f pyproject.toml ]; then
          echo "Creating initial pyproject.toml in ./config..."
          uv init --bare --vcs none --python 3.11 --name pyspark-workspace
          uv add --no-sync \
            "delta-spark==4.4.1" \
            "notebook>=7.2.0,<8.0.0" \
            "pyarrow>=18.0.0" \
            "pandas>=2.2.0,<2.3.0" \
            "numpy>=1.26.0,<2.1.0" \
            "grpcio>=1.62.0" \
            "grpcio-status>=1.62.0" \
            "protobuf>=4.25.0,<6.0.0" \
            matplotlib seaborn scikit-learn findspark \
            "fsspec>=2024.2.0" \
            "adlfs>=2024.2.0" "azure-identity>=1.15.0" \
            "s3fs>=2024.2.0" "boto3>=1.34.0" \
            "gcsfs>=2024.2.0" "google-cloud-storage>=2.16.0"
        fi
        echo "Running uv sync..."
        uv sync --inexact
        exec /opt/venv/bin/jupyter notebook \
          --ip=0.0.0.0 \
          --port=8888 \
          --no-browser \
          --allow-root \
          --IdentityProvider.token='spark' \
          --ServerApp.max_body_size=10737418240 \
          --ServerApp.max_buffer_size=10737418240 \
          --notebook-dir=/opt/spark/notebooks

volumes:
  pyspark_venv: